name: RFC Proposal
description: Propose a major feature or architectural change
title: "[RFC]: "
labels:
  - rfc
body:
  - type: markdown
    attributes:
      value: |
        RFCs are for major changes that require community and maintainer feedback before implementation.

        Examples:
        - New major systems
        - Large features
        - Architecture changes
        - Database redesigns
        - Replacing major dependencies

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the proposed change.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: Proposed Design
      description: Explain how this should work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches were considered?

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Explain user, developer, and compatibility impact.

  - type: textarea
    id: questions
    attributes:
      label: Open Questions
      description: What feedback do you need from contributors?
