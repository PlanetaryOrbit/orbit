name: Update Contributor Map

on:
  schedule:
    - cron: '0 0 * * 1'
  push:
    branches: [v3-vue]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  map:
    if: github.ref == 'refs/heads/v3-vue'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate contributor map
        uses: tunaitis/contributor-map@v1.1
        with:
          output: assets/contributor-map.svg

      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git diff --quiet || (git add assets/contributor-map.svg && git commit -m "chore: update contributor map" && git push)
